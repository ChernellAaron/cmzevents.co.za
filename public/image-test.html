<!DOCTYPE html>
<html>
<head>
  <title>Image Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .image-test { margin-bottom: 30px; border: 1px solid #ccc; padding: 10px; }
    img { border: 2px solid red; max-width: 400px; }
  </style>
</head>
<body>
  <h1>Image Test Page</h1>
  
  <div class="image-test">
    <h2>Logo Test:</h2>
    <img src="/logo.png" alt="Logo">
    <p>Path: /logo.png</p>
  </div>
  
  <div class="image-test">
    <h2>Team Image Test:</h2>
    <img src="/Team.jpg" alt="Team">
    <p>Path: /Team.jpg</p>
  </div>
  
  <div class="image-test">
    <h2>Sound Equipment Test:</h2>
    <img src="/sound-equipment.jpg" alt="Sound Equipment">
    <p>Path: /sound-equipment.jpg</p>
  </div>
  
  <div class="image-test">
    <h2>Event Image Test:</h2>
    <img src="/event2.jpg" alt="Event 2">
    <p>Path: /event2.jpg</p>
  </div>
</body>
</html>
